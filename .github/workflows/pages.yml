name: Update data and deploy dashboard

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/pages.yml"
      - "prototype/mi-dashboard-shadcn/**"
  workflow_dispatch:
    inputs:
      data_source:
        description: "Repository-relative path, accessible URL, or self-hosted runner path"
        required: false
        type: string
      runner:
        description: "Use self-hosted only for an internal or local file path"
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted
        required: true
        type: choice

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    env:
      DASHBOARD_DATA_SOURCE: ${{ inputs.data_source || vars.DASHBOARD_DATA_SOURCE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: prototype/mi-dashboard-shadcn/package-lock.json
          node-version: 24

      - name: Install
        run: npm ci
        working-directory: prototype/mi-dashboard-shadcn

      - name: Update dashboard data
        if: ${{ env.DASHBOARD_DATA_SOURCE != '' }}
        run: npm run data:update
        working-directory: prototype/mi-dashboard-shadcn

      - name: Verify
        run: npm run data:check && npm test && npm run lint
        working-directory: prototype/mi-dashboard-shadcn

      - name: Build
        run: npm run build
        working-directory: prototype/mi-dashboard-shadcn

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
